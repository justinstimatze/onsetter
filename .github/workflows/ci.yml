name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Checkout and the Go toolchain are all this needs; anything more is a token
# handed to every action in the job for no reason.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: golangci-lint
        # Same gate `make check` runs locally (.golangci.yml at repo root) —
        # errcheck/ineffassign/unused aren't covered by vet or staticcheck
        # above, so CI was passing on things `make check` would have failed.
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: test
        # the hook tests build the binary and drive it over stdin, the way
        # Claude Code does; nothing here needs network or a real session
        run: go test ./...
