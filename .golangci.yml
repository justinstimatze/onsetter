version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        # Best-effort cleanup; logged elsewhere where it matters.
        - (*os.File).Close
        - os.Remove
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Fprint
    gosec:
      excludes:
        # G304/G703: "file path built from a variable" fires on nearly every
        # path onsetter constructs (session id, XDG cache dir, repo path) —
        # confirmed low-value here specifically, since every such path stays
        # inside the calling user's own trust boundary (discover.Roots()
        # only ever walks upward to .git/$HOME, reading fixed filenames).
        # A real integer-overflow finding elsewhere (G115) is handled with a
        # scoped //nolint instead of a blanket exclude, on purpose — this
        # one recurs too broadly to annotate call site by call site.
        - G304
        - G703
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - staticcheck
      - path: scripts/
        linters:
          - errcheck
          - govet
          - staticcheck
          - unused
