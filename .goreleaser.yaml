version: 2

builds:
  - id: onsetter
    main: ./cmd/onsetter
    binary: onsetter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # .Tag, not .Version: the Makefile's local builds bake in git describe's
      # v-prefixed string (v0.7.0), and .Version strips the v — using it here
      # would make a goreleaser-built binary self-report a different version
      # string than a locally-built one for the identical commit.
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: default
    formats: ['tar.gz']
    name_template: "onsetter_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

changelog:
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

release:
  github:
    owner: justinstimatze
    name: onsetter
  draft: false
  prerelease: auto
